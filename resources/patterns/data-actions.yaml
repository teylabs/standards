answer: Logic that changes data
entry: data-actions
nodes:
  - id: data-actions
    question: What are you adding?
    options:
      - { answer: "An operation that changes state", next: data-actions.action }
      - { answer: "A model or table", next: data-actions.model }
      - { answer: "An output: a rendered document or a public API operation", next: data-actions.output }
      - { answer: "A bulk import", next: data-actions.file-import }
      - { answer: "None of these", next: data-actions.byo }
  - id: data-actions.model
    question: Does the model need composite-FK tenancy and a lock_version stale-write guard?
    options:
      - { answer: "Yes, it is workspace-scoped", next: data-actions.tenant-model }
      - { answer: "No; it needs enum and check-constraint conventions", next: data-actions.constraints }
      - { answer: "Its history must be append-only", next: data-actions.ledger }
      - { answer: "It needs file or photo attachments", next: data-actions.record-extras }
      - { answer: "None of these", next: data-actions.model.byo }
  - id: data-actions.output
    question: Which output?
    options:
      - { answer: "A rendered document such as a PDF", next: data-actions.document }
      - { answer: "A public, versioned API operation", next: data-actions.api-op }
      - { answer: "A report with aggregation and export", next: data-actions.report }
      - { answer: "None of these", next: data-actions.output.byo }
  - id: data-actions.record-extras
    question: Which addition?
    options:
      - { answer: "Per-record files and photos (media library)", next: data-actions.media-library }
      - { answer: "None of these", next: data-actions.record-extras.byo }
  - id: data-actions.action
    recipe: Domain action
    summary: One principal-first Action owns the write. It checks lock_version against stale writes, which also stops concurrent edits, and is shared by controllers, jobs and MCP tools.
    kit: []
    make: standards:make action --flavor=plain
    checks: ['actions', '21']
    paths: ['app/**/Actions/**']
    keywords: [action, write, business logic, mutate, operation]
    status: ready
    evidence: { apps: 7, count: 33, prs: 33, past_apps: 13, past_count: 73 }
