answer: Logic that changes data
entry: data-actions
nodes:
  - id: data-actions
    question: What are you adding?
    options:
      - { answer: "An operation that changes state", next: data-actions.action }
      - { answer: "A model or table", next: data-actions.model }
      - { answer: "A rendered document such as a PDF", next: data-actions.document }
      - { answer: "A public, versioned API operation", next: data-actions.api-op }
      - { answer: "A bulk import", next: data-actions.import }
  - id: data-actions.model
    question: Does the model need composite-FK tenancy and a lock_version stale-write guard?
    options:
      - { answer: "Yes, it is workspace-scoped", next: data-actions.tenant-model }
      - { answer: "No; it needs enum and check-constraint conventions", next: data-actions.constraints }
      - { answer: "Its history must be append-only", next: data-actions.ledger }
  - id: data-actions.action
    recipe: Domain action
    summary: One principal-first Action owns the write, checks for stale writes, and is shared by controllers, jobs and MCP tools.
