answer: A connection to another service
entry: integrations
nodes:
  - id: integrations
    question: Which service?
    options:
      - { answer: "Monitoring", next: integrations.monitoring }
      - { answer: "Payments and billing", next: integrations.billing }
      - { answer: "An AI model or agent", next: integrations.ai }
      - { answer: "Another provider's API or webhooks", next: integrations.provider }
