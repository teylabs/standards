  - id: integrations.api
    question: Is there an official SDK, and a fake driver for tests?
    options:
      - { answer: "Yes: wrap the official SDK behind a contract, with a fake", next: integrations.api-client }
      - { answer: "No: Laravel's Http behind a contract, with a fake", next: integrations.api-client.http }
      - { answer: "None of these", next: integrations.api.byo }
  - id: integrations.monitoring
