  - id: integrations.webhook
    recipe: Inbound webhook
    summary: "A signed inbound webhook on spatie/laravel-webhook-client: an HMAC signature over the raw body compared with hash_equals, with a timestamp tolerance (a bad or expired one is a 403); a profile that stores any signed event; a queued job idempotent by event id (a duplicate is answered 2xx and processed once) dispatching to a per-event handler map, where an unknown event is stored but not processed; a route outside the web group with its own rate limit. Never log the body or the secret."
    kit: []
    make: standards:make webhook --flavor=signed
    checks: ['integrations']
    paths: ['app/Webhooks/**', 'routes/webhooks.php']
    keywords: [webhook, callback, inbound, signature, hmac, replay, idempotent]
    status: ready
    evidence: { apps: 4, count: 15, prs: 15, past_apps: 12, past_count: 28 }
  - id: integrations.api-client
    recipe: API client (official SDK)
    summary: "The provider's official SDK behind an app contract: the contract, an SDK-backed client that turns SDK errors into one exception carrying no request data, a Fake bound in tests, config/services.php and .env.example keys, and a test against the Fake. The app never calls the SDK or Http:: directly."
    kit: []
    make: standards:make api-client --flavor=sdk
    checks: ['integrations']
    paths: ['app/Services/**']
    keywords: [api, client, sdk, third party, contract, fake]
    status: ready
    evidence: { apps: 4, count: 15, prs: 15, past_apps: 12, past_count: 28 }
  - id: integrations.api-client.http
    recipe: API client (HTTP)
    summary: "With no official SDK, Laravel's Http behind an app contract: a macro with the base URL, token, a timeout and retries with backoff on a connection error or a 5xx; errors carry the status only; a Fake bound in tests, config and .env.example keys, and tests on the Fake and on faked HTTP that never reach the service."
    kit: []
    make: standards:make api-client --flavor=http
    checks: ['integrations']
    paths: ['app/Services/**']
    keywords: [api, client, http, rest, retry, timeout, contract, fake]
    status: ready
    evidence: { apps: 4, count: 15, prs: 15, past_apps: 12, past_count: 28 }
