answer: Work that runs later
entry: background
nodes:
  - id: background
    question: When does it run?
    options:
      - { answer: "After a request, in the background", next: background.job }
      - { answer: "On a schedule", next: background.schedule }
      - { answer: "When an operator runs a command", next: background.command }
      - { answer: "When a broadcast refreshes an open page", next: background.live }
      - { answer: "None of these", next: background.byo }
  - id: background.job
    recipe: Queued job
    summary: A queued job that calls the Action doing the work, so the logic is shared and the job stays thin.
    kit: []
    make: standards:make job --flavor=plain
    checks: ['actions']
    paths: ['app/**/Jobs/**']
    keywords: [queue, job, background, async]
    status: ready
  - id: background.schedule
    recipe: Scheduled job
    summary: A scheduled job registered with an overlap guard and a retention sweep. The evidence is weak; few cited changes clearly fit.
    kit: []
    checks: []
    paths: []
    keywords: [schedule, cron, nightly, retention]
    status: gap
    evidence: { apps: 4, count: 21, prs: 21, past_apps: 7, past_count: 22 }
  - id: background.command
    recipe: Operator command
    summary: "An artisan command whose work runs through Tey\\Standards\\Operator\\Operator::run: a dry run unless --apply, idempotent (a re-run reports already done), refused in production unless allow-listed or --force with the name typed back, locked to one run at a time, and ending in a summary table (processed, changed, skipped, failed) that exits non-zero on failure and never prints record data. --backfill fills a column, --maintenance deletes stale rows, --report counts read-only."
    kit: []
    make: standards:make command --flavor=backfill
    checks: ['operator']
    paths: ['app/Console/**']
    keywords: [command, artisan, operator, backfill, maintenance, report, dry run, apply, idempotent]
    status: ready
    evidence: { apps: 6, count: 11, prs: 11, past_apps: 18, past_count: 129 }
  - id: background.live
    recipe: Live props
    summary: "Inertia live props refresh an open page when a notice broadcasts: tey/kit's LiveProps::on makes the view-model props live (capability-gated with `when`), echoLiveTransport carries them, useLiveFallbackPoll keeps a slow poll, and a component's own reader stands down with useIsLive. The notice is ShouldBroadcastNow, on a private workspace-scoped channel authorised in routes/channels.php."
    kit: []
    checks: ['live.broadcast-now']
    paths: []
    keywords: [live props, live, broadcast, realtime, websocket, reverb, echo, refresh on change, push updates]
    status: draft
  - id: background.byo
    recipe: Build your own
    summary: "No recipe fits this answer yet. Proceed with the general conventions, stamp new files `standards-pattern: gap`, and the demand is recorded."
    kit: []
    checks: []
    paths: []
    keywords: []
    status: byo
