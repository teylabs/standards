id: manage-records
summary: Manage a record type end to end. People list, create, edit and view it, with optional bulk actions, assistant access and notifications.
keywords: [manage records, crud, records, resource, admin screens, bulk actions, list create edit]
questions:
  - { id: bulk, question: "Do people act on many records at once (bulk actions, filters, sorting)?", options: ["yes", "no"] }
  - { id: mcp, question: "Should an AI assistant be able to read or change these records?", options: ["yes", "no"] }
  - { id: notify, question: "Should someone be told when a record changes?", options: ["yes", "no"] }
composition:
  - { unit_leaf_id: ui-page.crud-resource, role: "scaffold: standards:make crud, with --bulk and --mcp from the answers" }
  - { unit_leaf_id: ui-page.index, role: list }
  - { unit_leaf_id: ui-page.form, role: create and edit }
  - { unit_leaf_id: ui-page.show, role: detail }
  - { unit_leaf_id: data-actions.action, role: write }
  - { unit_leaf_id: ui-page.toast, role: save confirmation }
  - { unit_leaf_id: ui-page.action-menu, role: record actions }
  - { unit_leaf_id: ui-page.data-table, role: bulk actions, when: bulk=yes }
  - { unit_leaf_id: mcp.write, role: assistant access, when: mcp=yes }
  - { unit_leaf_id: mail-notifications.notification, role: notification, when: notify=yes }
