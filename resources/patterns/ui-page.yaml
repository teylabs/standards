answer: A page people open in the browser
entry: ui-page
nodes:
  - id: ui-page
    question: Who opens the page?
    why: Guests, signed-link recipients, panel users and signed-in users each get a different shell, auth and caching.
    options:
      - { answer: "A signed-in user of the app", next: ui-page.app }
      - { answer: "A guest on a public page", next: ui-page.public }
      - { answer: "Someone arriving by a signed link, or a paired second device", next: ui-page.signed }
      - { answer: "A user of a Filament panel", next: ui-page.filament }
      - { answer: "None of these", next: ui-page.byo }
  - id: ui-page.app
    question: Does the page live in a kit-owned subtree (the dashboard, the auth screens), or is it the app's own?
    why: Kit-owned pages are extended by registration or slots, never copied into the app.
    options:
      - { answer: "It extends a kit-owned page", next: ui-page.kit-owned }
      - { answer: "It is one of the app's own pages", next: ui-page.own }
      - { answer: "Several CRUD screens at once, or a bespoke workflow", next: ui-page.larger }
      - { answer: "Something every page shares: feedback toasts, or how pages are styled", next: ui-page.shared }
      - { answer: "None of these", next: ui-page.app.byo }
  - id: ui-page.shared
    question: Which shared concern?
    why: Toasts, styling, the signed-in shell, kit adoption and guards over every page each have one app-wide convention and a check.
    options:
      - { answer: "Feedback after a save or a background result (a toast)", next: ui-page.toast }
      - { answer: "Styling or page layout: CSS, theme tokens, spacing between blocks, columns, action groups", next: ui-page.look }
      - { answer: "The signed-in shell (header, primary nav, account menu, workspace switcher), navigation inside it (breadcrumbs, page tabs), or where a module's pages live (its URLs)", next: ui-page.navigation }
      - { answer: "Across the whole app: adopting every kit surface, or a test that guards every route or page", next: ui-page.app-wide }
      - { answer: "None of these", next: ui-page.shared.byo }
  - id: ui-page.navigation
    question: The signed-in shell, navigation inside it, or where a module's pages live?
    why: The shell is the chrome every signed-in page renders in; a module's URLs are where its records and settings sit below the workspace.
    options:
      - { answer: "The signed-in shell: the header, primary nav, account menu or workspace switcher", next: ui-page.shell }
      - { answer: "Where a module's pages live: its URL prefix, its records' URLs, their route names and its settings", next: ui-page.module-urls }
      - { answer: "Breadcrumbs, a module's sibling pages or a record's sections (tabs, sub-nav)", next: ui-page.page-tabs }
      - { answer: "None of these", next: ui-page.navigation.byo }
  - id: ui-page.look
    question: Styling, or page layout?
    why: Styling is how elements look (Tailwind and theme tokens); page layout is how a page spaces and arranges its blocks with the kit's primitives.
    options:
      - { answer: "Styling: CSS, inline styles, theme tokens or a dynamic value", next: ui-page.styling }
      - { answer: "Page layout: spacing between blocks, columns, action groups and row actions", next: ui-page.layout-rhythm }
      - { answer: "None of these", next: ui-page.look.byo }
  - id: ui-page.app-wide
    question: Which app-wide task?
    why: Adopting the kit and guarding every page both work across the whole app, from the kit's surfaces and from what each route or page declares.
    options:
      - { answer: "Adopting every kit surface across the app (standards:adoption)", next: ui-page.kit-adoption }
      - { answer: "A test that guards every route or page (a route snapshot, a list of modal or exempt pages)", next: ui-page.declared-guards }
      - { answer: "A browser test of a page's layout or look (sizes, spacing, colours, fonts)", next: ui-page.layout-tests }
      - { answer: "A browser test that checks a page is accessible (axe, WCAG)", next: ui-page.accessible-pages }
      - { answer: "None of these", next: ui-page.app-wide.byo }
  - id: ui-page.kit-owned
    question: Which kit-owned page?
    options:
      - { answer: "The dashboard", next: ui-page.dashboard-widget }
      - { answer: "A sign-in, registration or password screen", next: ui-page.auth-override }
      - { answer: "None of these", next: ui-page.kit-owned.byo }
  - id: ui-page.own
    question: What does the page mainly do?
    why: "Step 1, before choosing components: state the page purpose, who opens it and their first job, in one line on the page ViewModel's class docblock as `@purpose <who>: <main job>` (`@purpose Staff: watch unsigned agreements; send one occasionally.`). The answer below follows from that job; each has its own controller method, page shape and test."
    options:
      - { answer: "Lists records", next: ui-page.list }
      - { answer: "Shows one record", next: ui-page.show }
      - { answer: "Creates or edits a record", next: ui-page.form }
      - { answer: "Adds buttons, links, menus or uploads to a page", next: ui-page.actions }
      - { answer: "None of these", next: ui-page.own.byo }
  - id: ui-page.list
    question: Does the list need sorting, filters, row actions or reordering?
    options:
      - { answer: "No, a plain list", next: ui-page.index }
      - { answer: "Yes", next: ui-page.data-table }
      - { answer: "None of these", next: ui-page.list.byo }
  - id: ui-page.actions
    question: Which kind of control?
    why: Add buttons, external links, action menus, page header actions and uploads each have a kit component and a check.
    options:
      - { answer: "An add or create button", next: ui-page.add-button }
      - { answer: "A link to another site", next: ui-page.external-link }
      - { answer: "Actions on a page header or a record", next: ui-page.action-place }
      - { answer: "A file upload field", next: ui-page.upload }
      - { answer: "None of these", next: ui-page.actions.byo }
  - id: ui-page.action-place
    question: Where do the actions sit?
    why: The page header splits its actions into a primary, secondaries and More; a record's menu holds its actions behind one trigger.
    options:
      - { answer: "In the page header, beside the title", next: ui-page.header-actions }
      - { answer: "In a menu on one record", next: ui-page.action-menu }
      - { answer: "It starts work and shows its progress in a modal", next: ui-page.modal-run }
      - { answer: "None of these", next: ui-page.action-place.byo }
  - id: ui-page.modal-run
    recipe: Run in a modal
    summary: "One request starts the work and opens its progress (Jasper, 2026-11-04). The kit action is a dialog descriptor (GET to fetch, POST to start). Its controller starts the run with tey/docket, reusing the active one: `Docket::job($job)->name('report.preview')->about($subject)->uniqueBy(...)->dispatch()` reuses per user by default (tey/docket 0.6.5+); add `->shared()` for subject-level work, with a view policy that admits everyone it is shared with. The controller answers with the modal and `Docket::snapshot($ticket)` as a prop, which refuses a run the user may not view. The modal renders `<DocketRunDialog :run>`, which streams the run, with its `#steps` slot passed to the kit `<Checklist>`. The kit action shows ModalLink's loading as a spinner and ignores repeat clicks (tey/kit 0.7.32+); a modal opened from code uses useModalVisit. No client POST, no app spinner code. See tey/kit docs/pending-actions.md."
    kit: []
    checks: []
    paths: []
    keywords: [modal, dialog, progress, preview, report, export, docket, run, spinner, loading, double click, pending, checklist]
    status: draft
  - id: ui-page.larger
    question: Is it a full set of CRUD screens, a workflow page beyond CRUD, a full-screen display, or a full-screen sub-page?
    options:
      - { answer: "Index, form and show screens for one record type", next: ui-page.crud-resource }
      - { answer: "A workflow page beyond CRUD (a workbench, a live console, a synced source, an activity stream)", next: ui-page.workflow }
      - { answer: "A full-screen output another screen drives (projector, kiosk TV)", next: ui-page.stage-display }
      - { answer: "A full-screen sub-page that leaves its parent's layout (a bench, an editor), with a way back", next: ui-page.back-strip }
      - { answer: "None of these", next: ui-page.larger.byo }
  - id: ui-page.workflow
    question: Which workflow page?
    why: A workbench edits records, a console runs a live session, a synced page mirrors an outside source, and a stream shows activity; each has its own regions and tests.
    options:
      - { answer: "A workbench: edit a sequence of items with a live preview", next: ui-page.workbench }
      - { answer: "Run a live session: a stage plus side panels that act on it in real time", next: ui-page.live-console }
      - { answer: "Connect an outside source and sync it on demand", next: ui-page.external-sync }
      - { answer: "An activity stream", next: ui-page.activity-feed }
      - { answer: "None of these", next: ui-page.workflow.byo }
  - id: ui-page.signed
    question: Does a second device act for a signed-in user (a phone remote, a paired screen)?
    why: A signed-link recipient is a guest acting for themselves; a paired device acts for a signed-in user and must be re-authorised on every request.
    options:
      - { answer: "No, a recipient arriving by a signed link", next: ui-page.signed-guest }
      - { answer: "Yes, a paired device acts for a signed-in user", next: ui-page.remote }
      - { answer: "None of these", next: ui-page.signed.byo }
  - id: ui-page.public
    question: Which public or shared page?
    options:
      - { answer: "Marketing, product or legal (privacy, terms)", next: ui-page.public-legal }
      - { answer: "An error page anyone can hit", next: ui-page.error }
      - { answer: "A live or in-person experience (a demo exhibit, a kiosk, a live audience)", next: ui-page.public.live }
      - { answer: "None of these", next: ui-page.public.byo }
  - id: ui-page.public.live
    question: Which live or in-person experience?
    options:
      - { answer: "A per-visitor demo exhibit", next: ui-page.exhibit }
      - { answer: "A kiosk-style entry flow", next: ui-page.kiosk }
      - { answer: "Guests join a live session on their phone and interact (react, vote, chat)", next: ui-page.audience-live }
      - { answer: "None of these", next: ui-page.public.live.byo }
  - id: ui-page.index
    recipe: Inertia index page
    summary: A CRUDDY index controller passes a typed ViewModel to resources/js/pages/<Area>/Index/Page.vue; its table is a TableQuery (search, declared filters and sorts from the URL, an unknown one a 400) with each row's actions decided on the server.
    kit: ['@kit/ui Page', '@kit/ui ButtonGroup', '@kit/ui InertiaAction', '@kit/ui DataTable', '@kit/ui IndexToolbar', '@kit/ui RowActions']
    components:
      - { name: "page shell", kit_component: Page, use: "Wraps the whole page with title and breadcrumbs; its #actions slot holds the header actions (ui-page.header-actions). No SectionHeader repeating the title above the table", props_hint: "title, #actions" }
      - { name: "add action", kit_component: InertiaAction, use: "The create action by name in the header's ButtonGroup (null renders nothing)", props_hint: "action" }
      - { name: "rows", kit_component: DataTable, use: "The record list, server-driven: rows, URL state, empty states", props_hint: "table (TableData)" }
      - { name: "filters", kit_component: IndexToolbar, use: "Search and the server's filter choices (DataTable renders it)", props_hint: "table.choices" }
      - { name: "row menu", kit_component: RowActions, use: "Per-row actions from the server (DataTable renders it)", props_hint: "row.actions descriptors" }
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'descriptors', 'js-imports', 'vm.typed-pages', 'vm.shaped-arrays', 'vm.nested-reach', 'vue.bare-handler-argument', 'inertia.pure', 'vm.page-size', 'ui.page-purpose']
    paths: ['app/**/Http/Controllers/**', 'app/**/ViewModels/**', 'resources/js/pages/**/Index/Page.vue']
    keywords: [list, index, table, browse, overview]
    status: ready
  - id: ui-page.show
    recipe: Inertia show page
    summary: A show method passes one record's ViewModel to resources/js/pages/<Area>/Show/Page.vue; dates render relative to the viewer's timezone, never by hand.
    kit: ['@kit/ui Page', '@kit/ui Section', '@kit/ui DescriptionList', '@kit/ui ButtonGroup', '@kit/ui InertiaAction', '@kit/ui DropdownAction']
    components:
      - { name: "page shell", kit_component: Page, use: "Wraps the record page; its #actions slot holds the record's actions (ui-page.header-actions), with no SectionHeader repeating the title", props_hint: "title, #actions" }
      - { name: "details", kit_component: Section, use: "Groups the record fields", props_hint: "title" }
      - { name: "fields", kit_component: DescriptionList, use: "The record's fields as term and description pairs (a real dl), with copy for an id or key", props_hint: "items, layout, copyable" }
      - { name: "actions", kit_component: ButtonGroup, use: "The record's actions written out by name: buttons in the default slot, the rest in the #menu (chevron)", props_hint: "default slot, #menu" }
      - { name: "action button", kit_component: InertiaAction, use: "One named server action as a button; confirms when the action has a confirmationMessage", props_hint: "action (null renders nothing)" }
      - { name: "menu action", kit_component: DropdownAction, use: "One named server action as a menu item", props_hint: "action" }
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'descriptors', 'js-imports', 'vm.typed-pages', 'vm.shaped-arrays', 'vm.nested-reach', 'vue.bare-handler-argument', 'inertia.pure', 'vm.page-size', 'ui.page-purpose']
    paths: ['app/**/Http/Controllers/**', 'resources/js/pages/**/Show/Page.vue']
    keywords: [show, detail, view, record, relative time, date]
    status: ready
  - id: ui-page.form
    recipe: Inertia form page
    summary: create/store or edit/update methods, a FormRequest, an Action for the write (principal first; an edit sends back its lock_version and a stale save is refused) and a toast on the redirect.
    kit: ['@kit/ui FormCard', '@kit/ui Field', '@kit/ui FormActions']
    components:
      - { name: "page shell", kit_component: Page, use: "Wraps the form page", props_hint: "title" }
      - { name: "form", kit_component: FormCard, use: "The form surface", props_hint: "title, @submit" }
      - { name: "field", kit_component: Field, use: "Label, input slot and error", props_hint: "label, error" }
      - { name: "input", kit_component: Input, use: "Text input inside a Field", props_hint: "v-model, name" }
      - { name: "submit", kit_component: FormActions, use: "Submit and cancel buttons", props_hint: "processing" }
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'toast', 'actions', 'descriptors', 'tenant.scoped-exists', 'ui.page-purpose']
    paths: ['app/**/Http/Requests/**', 'resources/js/pages/**/Form/Page.vue']
    keywords: [form, create, edit, store, update, save, toast, feedback]
    status: ready
  - id: ui-page.toast
    recipe: Toast feedback
    summary: >-
      Headless kit toasts (tey/kit 0.4.6+): the controller decides, through Toastable `$this->toast(...)` or `Toast::success|info|warning|error`,
      and the shell's one Toaster renders the flash; pages never call a useToast(). Toast saves and background or async results (Import finished, Export ready).
      Errors are validation or inline responses next to the field or row, never a toast alone; navigation is never toasted, the new page confirms it.
      Styles: pulse is the default for saves, with `->from('<action id>')` naming the descriptor key of the button that saved; anchored for table row actions and inline toggles;
      fly-out only by choice, when the movement should draw the eye; plain for background results and anything without a trigger (also the fallback when the trigger is missing or offscreen).
      Placement is shell-level `kit.toasts.position` (KIT_TOASTS_POSITION: auto, top-center, top-right, bottom-right, bottom-center), set per app and never per page.
      auto resolves as: under sm, bottom-center above sticky bars (for every position); sticky bottom bars plus right-aligned header actions, top-center; sticky bottom bars only, top-right; otherwise bottom-right.
      At most one action (label, href, optional get/post/put/patch), never destructive: a delete method or a delete/remove/discard/revoke label is refused, and a destructive step needs a confirmation instead.
    kit: ['@kit/ui Toaster', 'Tey\Kit\Features\Core\Toast', 'Tey\Kit\Features\Core\Concerns\Toastable']
    components:
      - { name: "toaster", kit_component: Toaster, use: "The one shell mount (Workspace Layout, GuestShell, or a host's own focus shell); never mounted per page", props_hint: "none; position comes from kitToasts" }
      - { name: "save trigger", kit_component: InertiaAction, use: "The named Save action in the header #actions slot or FormActions; its data-action is what ->from('<action id>') anchors the pulse or bubble to (ui-page.header-actions: actions written out by name, not a catch-all ActionBar)", props_hint: "the save Action descriptor" }
      - { name: "row trigger", kit_component: RowActions, use: "Row actions whose result shows as an anchored bubble on the right row", props_hint: "actions descriptors" }
    make: standards:make page --flavor=form
    checks: ['toast', 'descriptors']
    paths: []
    keywords: [toast, toaster, notification, flash, feedback, saved, confirmation, snackbar, undo, toast position]
    status: ready
  - id: ui-page.styling
    recipe: Pure Tailwind styling
    summary: >-
      Rule styling.pure-tailwind. The app styles with Tailwind utility classes and @theme tokens, never its own CSS: no <style> block in a .vue file,
      no style="..." attribute in .vue or Blade templates, no :style binding that sets a real CSS property, and no selector rules in app .css beyond
      Tailwind's directives, @font-face and custom-property tokens on :root and .dark. Kit-owned files, Filament theme CSS and resources/views/vendor/ are not scanned.
    kit: []
    checks: ['styling.pure-tailwind', 'format-lint']
    paths: ['resources/css/**']
    keywords: [styling.pure-tailwind, pure tailwind, inline style, style block, custom css, theme token]
    status: draft
    rules:
      - "Format and lint the frontend with the house Prettier and ESLint config (copy it from tey/starter; build the ignore lists from php artisan kit:list), and run npm run format:check and npm run lint:check in CI (rule format-lint, opt-in per app)."
      - "Static styling: Tailwind utility classes in the template. style=\"color:red\" becomes class=\"text-red-600\"; a <style> block's rules become classes on the elements."
      - "Design tokens: declare them in @theme (--color-brand: oklch(...), then bg-brand) or, for a value that changes with the theme, as --token on :root and .dark. A reusable compound is an @utility; an animation is --animate-* with its @keyframes inside @theme."
      - "Dynamic values: bind a custom property and read it in an arbitrary-value class: :style=\"{ '--x': v }\" with class=\"[color:var(--x)]\" or w-(--x). Only quoted '--name' keys pass; :style=\"{ width: w }\" or :style=\"styles\" fails. In Blade, style=\"--x: {{ $v }}\" (custom properties only)."
      - "A real exception goes in the allowlist: rule styling.pure-tailwind, the finding's target and check, a reason and an expires Y-m-d date. An entry without a reason is rejected and one without an expiry fails."
      - "A file the rule cannot read or parse is a finding, not a pass: fix the markup."
  - id: ui-page.shell
    recipe: Signed-in shell
    summary: >-
      Rule ui.kit-shell. Once an app adopts kit's shell feature, its signed-in pages render in kit's Workspace Layout (resources/js/pages/Workspace/Layout.vue):
      app.ts's layout callback returns it, or an app wrapper that renders it, and the app adds its parts through the Layout's slots and the server's navigation,
      never its own header, account menu or workspace switcher. Public, guest and focus pages keep PublicShell, GuestShell or their own layout; page sub-navs are fine.
    kit: ['shell Layout (pages/Workspace/Layout.vue)', 'shell UserMenu and WorkspaceSwitcher (@kit/shell)', 'shell PublicShell and GuestShell (pages/Workspace/Partials)']
    checks: ['ui.kit-shell']
    paths: ['resources/js/app.ts', 'resources/js/layouts/**']
    keywords: [ui.kit-shell, kit shell, signed-in header, workspace layout, account menu, user menu, workspace switcher, primary nav, logout]
    status: draft
    rules:
      - "app.ts's layout callback returns kit's Layout (import Layout from '@/pages/Workspace/Layout.vue') for signed-in pages; an app wrapper that renders that Layout is fine. In an array layout the first element is the shell and the rest are page sublayouts."
      - "App parts go in the Layout's slots: mark (the logo), nav and drawer-nav (an app's own module switcher), bar and actions (header controls), extra (account-menu items), user-menu and workspace-switcher (replacements with the same props), footer. Pages come from the server's navigation (Registry::navigation), not a hand-written nav."
      - "Public pages use PublicShell, sign-in pages GuestShell, and a focus flow its own layout; their headers are not signed-in shells. A page's own tabs or section nav inside the content area are fine."
      - "A real exception goes in the allowlist: rule ui.kit-shell, the finding's target and check, a reason and an expires Y-m-d date. An entry without a reason is rejected and one without an expiry fails."
  - id: ui-page.page-tabs
    recipe: Breadcrumbs and page tabs
    summary: >-
      Breadcrumbs are the kit's bar under the header, always. A module's sibling pages are PageTabs, registered with Registry::modulePage and sent by the server
      as the page's layout.navigation, which <Page> draws. A record's sections are PageTabs too, from the record ViewModel's own navigation, inside the record's
      frame under its header. No hand-rolled sub-nav strips.
    kit: ['shell Layout (pages/Workspace/Layout.vue)', '@kit/ui Page', '@kit/ui PageTabs', 'tey/kit Registry::modulePage()']
    components:
      - { name: "page tabs", kit_component: PageTabs, use: "A module's sibling pages, or a record's sections: route links with the current one marked", props_hint: "tabs, label" }
      - { name: "page", kit_component: Page, use: "Draws the page's layout.navigation as PageTabs above its heading", props_hint: "default slot" }
    checks: []
    paths: ['resources/js/pages/**/Layout.vue', 'app/**/Providers/*ServiceProvider.php']
    keywords: [breadcrumbs, breadcrumb bar, trail, tabs, page tabs, sub nav, subnav, sub-navigation, module pages, sibling pages, record tabs, section tabs, modulePage]
    status: draft
    rules:
      - "Breadcrumbs = bar, always (Jasper, fleet-wide): the shell's Layout draws the whole trail under the header, the current page last, so every page shows one trail in the same place. Don't pass breadcrumbs=\"page\" and don't draw a trail inside a page. The trail comes from the route's breadcrumbs through the page ViewModel's layout()."
      - "A module's sibling pages = PageTabs. Register each with Registry::modulePage($module, $ability, $label, $suffix, order:, active:) in the module's service provider, its suffix nested under the module's prefix (`bookings/calendar`, as ui-page.module-urls says; the kit warns in development otherwise). The server sends the ones the viewer may open as the page's layout.navigation, and a top-level <Page> draws them. Don't hand-write the tab list in a page."
      - "A record's sections = PageTabs, as AppraisalBench's case pages do: the record ViewModel sets its own layout.navigation, and the record's frame (its folder Layout.vue) renders one <PageTabs> from it under the record's header. That replaces the module's tabs, so a page never has two tab rows."
      - "No hand-rolled sub-nav strips: no row of links under the header or above the heading built from a page's own array, and no new use of the kit's deprecated SubNav strip (Layout sub-nav=\"strip\")."
  - id: ui-page.module-urls
    recipe: Module URL nesting
    summary: >-
      A module owns one URL prefix, `/@{workspace}/<module>` (kebab case), and every page of it nests below: its records at `/<module>/<records>`, a
      record's pages at `/<module>/<records>/{id}/<section>`. The record named after the module, or its main record, sits at the prefix itself. Setup the
      module needs only occasionally is a settings section at `/settings/<module>`. Route names follow the path, dots for slashes. Existing apps keep their URLs.
    kit: ['tey/kit Registry::navigation', 'tey/kit Registry::modulePage', 'tey/kit Registry::settingsSection', 'tey/kit WorkspaceRoutes::page']
    components: []
    make: standards:make crud --flavor=resource
    checks: []
    paths: ['routes/**', 'app/**/routes/**', 'app/**/Providers/**ServiceProvider.php']
    keywords: [module, url, prefix, nesting, nested routes, route names, module page, sub nav, settings section, url structure]
    status: ready
    rules:
      - "A module owns `/@{workspace}/<module>`, the module's name in kebab case. Its records nest under it: `/<module>/<records>` (`/bookings/resources`), never a top-level `/<records>` of their own."
      - "The record named after the module (its plural is the module's name), or the module's main record, sits at the prefix itself: `/bookings`, not `/bookings/bookings`."
      - "A record's own pages nest under the record: `/<module>/<records>/{id}/<section>` (`/bookings/resources/12/availability`)."
      - "Setup the module needs only occasionally is one settings section at `/settings/<module>`, not a page in the module's own navigation."
      - "Route names follow the path, dots for slashes: `bookings.resources.index`, `bookings.resources.show`, the main record `bookings.index`. Two modules' records of one name never collide, and a name is read off its URL."
      - "Navigation: the module registers one link at its prefix (Registry::navigation, suffix `<module>`), and each record is one of its pages (Registry::modulePage, suffix `<module>/<records>`). The main record's page is current on its own routes only (active: its `route:` names), not on its siblings below the prefix."
      - "`standards:make crud <Record> --module=<Module>` emits this shape; without --module a record keeps its own `/<records>` prefix, names and navigation link. Existing apps keep their URLs: this is the default for new modules, not a migration."
  - id: ui-page.kit-adoption
    recipe: Kit adoption
    summary: >-
      standards:adoption reads each installed package's adoption surfaces (resources/adoption/surfaces.json) and reports every surface as adopted,
      hand-rolled, missing, n/a or exempt, plus gaps: app components and libraries no surface covers. Migrate tier by tier, shell, then layout,
      then actions and toast, then forms, then data, re-running the report after each surface, until every row is adopted or n/a; then --ci and --compliance pass.
    kit:
      - 'shell Layout (pages/Workspace/Layout.vue)'
      - 'shell PublicShell, PrimaryNav and Breadcrumbs (pages/Workspace/Partials)'
