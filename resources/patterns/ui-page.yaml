    checks: []
    paths: ['resources/adoption/surfaces.json', 'resources/js/components/**']
    keywords: [standards:adoption, kit adoption, kit compliance, adoption surfaces, surfaces.json, hand-rolled, adoption gap, migrate to kit, kit migration]
    status: draft
    related: [ui-page.shell, ui-page.toast]
    rules:
      - "Blade, Livewire and Filament screens read hand-rolled until they are migrated to Inertia pages built with kit, which is Vue: a Blade view, a Livewire component or a Filament resource is never adoption. Mail and PDF templates (resources/views mail, emails and pdf folders) are out of scope by path, not exempted."
      - "Before you start: save a baseline with php artisan standards:adoption --json (vendor/bin/standards adoption --base . --inventory <kit>/resources/adoption/surfaces.json --json works without booting Laravel). Install kit (composer require tey/kit, php artisan kit:install), add each feature with php artisan kit:add <feature> (a preview), then --apply --expected-plan=<plan>, and commit .mod-maintenance/installed/ so kit's own files are not read as hand-rolled. Kit core needs the host's shadcn-vue primitives under @/components/ui; the plan prints the add command. Kit's pages install under lowercase resources/js/pages: when the app's pages directory has another case, kit:add --adopt-case renames it first."
      - "Precedence: a hand-rolled signal beats an adopted use. A row flips to adopted only when the kit use is present and every hand-rolled signal has stopped firing, so delete or rename the app's copy in the same change; importing kit's is not enough. Verify every surface the same way: re-run standards:adoption, the row reads adopted and its signals list is empty."
      - "Order: shell, layout, actions and toast, forms, data, then the rest. The shell decides where every page renders, and layout.page's hand-rolled check (rule ui.kit-shell) only runs once the shell is adopted. Layout gives later components their slots. Kit's form, table and modal components import Button, Dropdown, Dialog and Toaster, so moving actions early avoids two button systems side by side. Forms build on Button and the shell's toast plumbing. Data tables are the largest per-page rewrite and slot in RowActions and BulkBar directly once actions and forms are kit's."
      - "Shell. shell.workspace (signal: a signed-in .vue rooted in header, nav or aside naming the logout route or a user-menu, account-menu or sidebar component; app layout, sidebar, navbar or top-nav components): kit:add shell, return kit's Layout from app.ts's layout callback, register pages with Registry::navigation, add a breadcrumb per page route (Breadcrumbs reads the page's layout.breadcrumbs, built on the server), then delete the app layout, sidebar, header and breadcrumbs. shell.public (a public header, nav or footer naming login or register): render guest pages in PublicShell and delete the guest or public layout; the signal rarely fires, so check by hand that no guest page imports the old layout. auth.screens (Login or ForgotPassword pages, anything under pages/Auth/**, auth layouts and cards): kit:add session-ui and delete the old auth pages and layout. account.pages (profile and settings pages; update-profile, update-password, delete-user and two-factor components): kit:add workspace-ui, which needs workspaces, access, shell and session-ui, then delete the old profile pages."
      - "Layout. layout.page: wrap each page body in Page and turn hand-built heading and button rows into SectionHeader, with page header actions passed to kit Page's actions prop (`<Page :actions>`, ActionDescriptor[]); before the shell is adopted this row reads missing, never hand-rolled. layout.blocks (*Card.vue or *Panel.vue, collapse and accordion components): use Surface, Section and BlockStack; rename a domain component that only shares the suffix, or record a dated exemption. appearance.theme (dark-mode or theme-toggle components, useDark): call initializeTheme() at boot and put AppearanceToggle in the user menu. platform.timezone (timezone libraries): call syncTimezoneCookie() at boot and use TimezoneSelect where users pick a zone."
      - "Actions and toast. action.button (Button, PrimaryButton, SecondaryButton or DangerButton files): move imports to kit's Button with a variant, then delete the files. feedback.toast (npm toast libraries; toast, notification or flash components): mount Toaster once in the shell, move flash messages onto kit's toast flow, remove the library from package.json. action.confirm (sweetalert imports; confirm modals and dialogs): route destructive actions through DropdownDelete or Dialog. action.menu (headless menu or floating-vue imports, Dropdown*.vue): Dropdown with its items. overlay.modal (a dialog tag or modal libraries): Modal for server-driven modal pages, DropdownModalLink to open one from a menu, Dialog, Popover or Sheet otherwise. feedback.alert (Alert, Banner or EmptyState files): Alert or StageNotice, EmptyState, and FormStatus for a persistent post-submit message."
      - "Forms. form.frame (any literal form tag in an app .vue; form-section, form-card, action-section and repeater components): put each form on Inertia's Form inside FormCard, with Field for label, description and error; files under components/Kit/** never count. form.inputs (input other than hidden, search or file, select, textarea, multiselect, combobox and masking libraries): Input, Checkbox, Select, InputSelect (multiple, creatable, searchable), Textarea, InputNumber, RadioCardGroup. form.files (upload libraries or an input of type file): FileInput or BulkDrop, with Tey\\Kit\\Media on the server. form.rich-text (editor libraries): InputRichText; check the stored content format before switching."
      - "Data. data.table (a table tag in a page, *DataTable*.vue, table libraries): per index page, build TableData with TableQuery on the server and render DataTable with IndexToolbar, RowActions and BulkBar; a layout table that is not data needs a rewrite or a dated exemption. data.list (virtual-scroll and infinite-loading libraries): ScrollList, and DescriptionList for key-value detail. data.badge and data.avatar (Badge, *Pill or *Chip files; Avatar files or avatar libraries): Badge and Avatar. feed.activity (timeline, activity or history components): ActivityStream with useCursorFeed. navigation.search (search or command-palette components): SearchBox."
      - "The rest. mail.layout (a mail Blade view not built on mail::message or kit's fluent message, or published vendor/mail views) is server-side and independent of the UI tiers: move each Mailable onto FluentMailMessage or x-mail::message and delete the overrides. workbench (drag-and-drop sortable libraries): only real sequence editors move to Workbench; exempt a plain sortable list with a reason. data.computed and auth.passkeys: ComputedValue and PasskeyOffer."
      - "Finish: php artisan standards:adoption --ci exits 1 on any hand-rolled or missing row or gap without a valid exemption, and on an expired, undated or stale exemption; record dated exemptions for deliberate leftovers and gate CI on it. Once kit is installed, do not pass --inventory to --ci or --compliance. php artisan standards:adoption --compliance passes only when every row is adopted or n/a and no gap or exemption is left: the end state."
      - "A gap: map the component or library to a surface (its replaces), replace it with kit, or report it as demand for a new surface. Where kit has no matching component (date formatting and pickers, contact links, attachment display rows, a switch), check kit for a newer component, then keep the app's own with a dated exemption and report the gap to kit."
      - "An exemption is an allowlist entry: rule adoption.<composer>.<surface-id> (or adoption.gap with the component path or npm:<package> as target), a check, a reason, a date and an expires Y-m-d date. It passes --ci until it expires and always blocks --compliance."
      - "Not covered: Blade, Livewire and Filament UI count only through a template-tag signal with in [blade] or a class-reference signal with paths, and never as adoption. It also cannot see surfaces whose hand-rolled form leaves no signal (page headers before the shell, guest layouts, dark-mode classes, timezone code without the listed libraries, hand-built key-value lists), in-house components that import no library, behaviour and visual parity, or the kit_adoptions table from the bare CLI. Check signed-in route facts before trusting an n/a."
  - id: ui-page.layout-rhythm
    recipe: Page layout rhythm
    summary: >-
      Rules ui.action-group, ui.row-actions, ui.page-title-dup, ui.no-outer-margins, ui.page-grid, ui.primitive-pointers and ui.row-action-label. Page gaps its children,
      components carry no outer margins, and spacing, columns, action groups and row actions come from the kit's primitives. Advisory until listed in
      Configuration::$optionalRules, then fail-on-new against a baseline (standards:allowlist --baseline) that only shrinks.
    kit: ['@kit/ui Page', '@kit/ui Stack', '@kit/ui BlockStack', '@kit/ui ButtonGroup', '@kit/ui ActionBar', '@kit/ui Toolbar', '@kit/ui DataTable', '@kit/ui SectionHeader']
    checks: ['ui.action-group', 'ui.row-actions', 'ui.page-title-dup', 'ui.no-outer-margins', 'ui.page-grid', 'ui.primitive-pointers', 'ui.row-action-label']
    paths: []
    keywords: [ui.action-group, ui.row-actions, ui.page-title-dup, ui.no-outer-margins, ui.page-grid, ui.primitive-pointers, ui.row-action-label, row action label, layout rhythm, outer margin, button group, row actions, page grid, flush, stack]
    status: draft
    rules:
      - "Two or more adjacent action controls (Button, button, DropdownConfirm, a Link with as=button or a variant) sit in a ButtonGroup, an ActionBar, a Toolbar (mixed controls such as a search box and buttons count), FormActions, or a Page or SectionHeader actions slot."
      - "Row actions are descriptors on the row (ActionDescriptor[] as actions), rendered by the DataTable's row ActionBar, not Buttons or menus in a #cell-* or #row-actions slot; a hand-rolled table with actions in its cells becomes a DataTable."
      - "A SectionHeader or PageSection does not repeat the Page title, and no SectionHeader size=page sits in a Page that draws its own heading. A page-level create action (a link to a *.create route) goes in <Page :actions>; the New, Create or Add label test is English-only and stays advisory."
      - "No mt-*, mb-*, my-* or space-y-* on a Page's direct children or on the root of a component a Page renders directly: the Page's gap owns the spacing; use Stack (BlockStack on a kit before the rename) with a gap-* class, or PageSection. A flush Page holds one full-bleed child (teleports, dialogs and absolute or fixed elements aside)."
      - "Page-level grid-cols-* and col-span-* become PageGrid (preset main-aside, halves or thirds) and PageGridItem :span. Grids inside a card, form or widget body and the dashboard widget grid are not page-level."
      - "Hand-rolled Stack, PageSection, Aside, Banner, NavGrid, CardSection, Pills and DividerSection shapes point to the primitive; a pointer stays advisory until the kit the app runs exports the primitive."
      - "Row action labels are short verbs (Remove, Revoke). A label never interpolates a value (Action::make(\"Revoke {$x->name}\"), 'Remove '.$grant, a model field, or a Vue action object's `${…}` label): the record goes in ariaLabel and the confirm. A literal label stays within 24 characters and 3 words, or RowActions clamps it."
      - "A record in a restricted state (suspended, archived, cancelled, revoked) offers only its restore action (Reinstate, Restore, Reopen, Reactivate). It may also offer at most one final action, such as Delete or Remove, when that state allows it."
      - "Every other action comes back only after the record is restored."
      - "The server enforces this in the policy and the action list. Hiding actions in the UI is not enough."
      - "A real exception goes in the allowlist: the rule, the finding's target and check, a reason and an expires Y-m-d date."
