answer: A page people open in the browser
entry: ui-page
nodes:
  - id: ui-page
    question: Who opens the page?
    why: Guests, signed-link recipients, panel users and signed-in users each get a different shell, auth and caching.
    options:
      - { answer: "A signed-in user of the app", next: ui-page.app }
      - { answer: "A guest on a public page", next: ui-page.public }
      - { answer: "A recipient arriving by a signed link", next: ui-page.signed-guest }
      - { answer: "A user of a Filament panel", next: ui-page.filament }
      - { answer: "None of these", next: ui-page.byo }
  - id: ui-page.app
    question: Does the page live in a kit-owned subtree (the dashboard, the auth screens), or is it the app's own?
    why: Kit-owned pages are extended by registration or slots, never copied into the app.
    options:
      - { answer: "It extends a kit-owned page", next: ui-page.kit-owned }
      - { answer: "It is one of the app's own pages", next: ui-page.own }
      - { answer: "Several CRUD screens at once, or a bespoke workflow", next: ui-page.larger }
      - { answer: "Feedback after a save or a background result (a toast)", next: ui-page.toast }
      - { answer: "None of these", next: ui-page.app.byo }
  - id: ui-page.kit-owned
    question: Which kit-owned page?
    options:
      - { answer: "The dashboard", next: ui-page.dashboard-widget }
      - { answer: "A sign-in, registration or password screen", next: ui-page.auth-override }
      - { answer: "None of these", next: ui-page.kit-owned.byo }
  - id: ui-page.own
    question: What does the page mainly do?
    why: Each answer has its own controller method, page shape and test.
    options:
      - { answer: "Lists records", next: ui-page.list }
      - { answer: "Shows one record", next: ui-page.show }
      - { answer: "Creates or edits a record", next: ui-page.form }
      - { answer: "Adds buttons, links, menus or uploads to a page", next: ui-page.actions }
      - { answer: "None of these", next: ui-page.own.byo }
  - id: ui-page.list
    question: Does the list need sorting, filters, row actions or reordering?
    options:
      - { answer: "No, a plain list", next: ui-page.index }
      - { answer: "Yes", next: ui-page.data-table }
      - { answer: "None of these", next: ui-page.list.byo }
  - id: ui-page.actions
    question: Which kind of control?
    why: Add buttons, external links, action menus and uploads each have a kit component and a check.
    options:
      - { answer: "An add or create button", next: ui-page.add-button }
      - { answer: "A link to another site", next: ui-page.external-link }
      - { answer: "A menu of actions on a record", next: ui-page.action-menu }
      - { answer: "A file upload field", next: ui-page.upload }
      - { answer: "None of these", next: ui-page.actions.byo }
  - id: ui-page.larger
    question: Is it a full set of CRUD screens, or a workflow page beyond CRUD?
    options:
      - { answer: "Index, form and show screens for one record type", next: ui-page.crud-resource }
      - { answer: "A workbench: edit a sequence of items with a live preview", next: ui-page.workbench }
      - { answer: "An activity stream", next: ui-page.activity-feed }
      - { answer: "None of these", next: ui-page.larger.byo }
  - id: ui-page.public
    question: Which public or shared page?
    options:
      - { answer: "Marketing, product or legal (privacy, terms)", next: ui-page.public-legal }
      - { answer: "A per-visitor demo exhibit", next: ui-page.exhibit }
      - { answer: "An error page anyone can hit", next: ui-page.error }
      - { answer: "A kiosk-style entry flow", next: ui-page.kiosk }
      - { answer: "None of these", next: ui-page.public.byo }
  - id: ui-page.index
    recipe: Inertia index page
    summary: A CRUDDY index controller passes a typed ViewModel to resources/js/pages/<Area>/Index/Page.vue; its table is a TableQuery (search, declared filters and sorts from the URL, an unknown one a 400) with each row's actions decided on the server.
    kit: ['@kit/ui Page', '@kit/ui SectionHeader', '@kit/ui DataTable', '@kit/ui IndexToolbar', '@kit/ui RowActions']
    components:
      - { name: "page shell", kit_component: Page, use: "Wraps the whole page with title and breadcrumbs", props_hint: "title" }
      - { name: "header", kit_component: SectionHeader, use: "Title plus the primary add action", props_hint: "title, actions slot" }
      - { name: "rows", kit_component: DataTable, use: "The record list, server-driven: rows, URL state, empty states", props_hint: "table (TableData)" }
      - { name: "filters", kit_component: IndexToolbar, use: "Search and the server's filter choices (DataTable renders it)", props_hint: "table.choices" }
      - { name: "row menu", kit_component: RowActions, use: "Per-row actions from the server (DataTable renders it)", props_hint: "row.actions descriptors" }
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'descriptors', 'js-imports']
    paths: ['app/**/Http/Controllers/**', 'app/**/ViewModels/**', 'resources/js/pages/**/Index/Page.vue']
    keywords: [list, index, table, browse, overview]
    status: ready
  - id: ui-page.show
    recipe: Inertia show page
    summary: A show method passes one record's ViewModel to resources/js/pages/<Area>/Show/Page.vue; dates render relative to the viewer's timezone, never by hand.
    kit: ['@kit/ui Page', '@kit/ui SectionHeader', '@kit/ui Section', '@kit/ui ActionBar']
    components:
      - { name: "page shell", kit_component: Page, use: "Wraps the record page", props_hint: "title" }
      - { name: "header", kit_component: SectionHeader, use: "Record title and its actions", props_hint: "title, actions slot" }
      - { name: "details", kit_component: Section, use: "Groups the record fields", props_hint: "title" }
      - { name: "actions", kit_component: ActionBar, use: "Record actions placed by the kit", props_hint: "actions descriptors" }
      - { name: "button set", kit_component: ButtonGroup, use: "Related buttons side by side", props_hint: "default slot" }
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'descriptors', 'js-imports']
    paths: ['app/**/Http/Controllers/**', 'resources/js/pages/**/Show/Page.vue']
    keywords: [show, detail, view, record, relative time, date]
    status: ready
  - id: ui-page.form
    recipe: Inertia form page
    summary: create/store or edit/update methods, a FormRequest, an Action for the write (principal first; an edit sends back its lock_version and a stale save is refused) and a toast on the redirect.
    kit: ['@kit/ui FormCard', '@kit/ui Field', '@kit/ui FormActions']
    components:
      - { name: "page shell", kit_component: Page, use: "Wraps the form page", props_hint: "title" }
      - { name: "form", kit_component: FormCard, use: "The form surface", props_hint: "title, @submit" }
      - { name: "field", kit_component: Field, use: "Label, input slot and error", props_hint: "label, error" }
      - { name: "input", kit_component: Input, use: "Text input inside a Field", props_hint: "v-model, name" }
      - { name: "submit", kit_component: FormActions, use: "Submit and cancel buttons", props_hint: "processing" }
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'toast', 'actions', 'descriptors']
    paths: ['app/**/Http/Requests/**', 'resources/js/pages/**/Form/Page.vue']
    keywords: [form, create, edit, store, update, save, toast, feedback]
    status: ready
  - id: ui-page.toast
    recipe: Toast feedback
    summary: >-
      Headless kit toasts (tey/kit 0.4.6+): the controller decides, through Toastable `$this->toast(...)` or `Toast::success|info|warning|error`,
      and the shell's one Toaster renders the flash; pages never call a useToast(). Toast saves and background or async results (Import finished, Export ready).
      Errors are validation or inline responses next to the field or row, never a toast alone; navigation is never toasted, the new page confirms it.
      Styles: pulse is the default for saves, with `->from('<action id>')` naming the descriptor key of the button that saved; anchored for table row actions and inline toggles;
      fly-out only by choice, when the movement should draw the eye; plain for background results and anything without a trigger (also the fallback when the trigger is missing or offscreen).
      Placement is shell-level `kit.toasts.position` (KIT_TOASTS_POSITION: auto, top-center, top-right, bottom-right, bottom-center), set per app and never per page.
      auto resolves as: under sm, bottom-center above sticky bars (for every position); sticky bottom bars plus right-aligned header actions, top-center; sticky bottom bars only, top-right; otherwise bottom-right.
      At most one action (label, href, optional get/post/put/patch), never destructive: a delete method or a delete/remove/discard/revoke label is refused, and a destructive step needs a confirmation instead.
    kit: ['@kit/ui Toaster', 'Tey\Kit\Features\Core\Toast', 'Tey\Kit\Features\Core\Concerns\Toastable']
    components:
      - { name: "toaster", kit_component: Toaster, use: "The one shell mount (Workspace Layout, GuestShell, or a host's own focus shell); never mounted per page", props_hint: "none; position comes from kitToasts" }
      - { name: "save trigger", kit_component: ActionBar, use: "Descriptor buttons carry data-action, which ->from('<action id>') anchors the pulse or bubble to", props_hint: "actions descriptors" }
      - { name: "row trigger", kit_component: RowActions, use: "Row actions whose result shows as an anchored bubble on the right row", props_hint: "actions descriptors" }
    make: standards:make page --flavor=form
    checks: ['toast', 'descriptors']
    paths: []
    keywords: [toast, toaster, notification, flash, feedback, saved, confirmation, snackbar, undo, toast position]
    status: ready
  - id: ui-page.add-button
    recipe: Add action button
    summary: Add, New and Create buttons are kit Buttons carrying the Plus icon.
    kit: ['@kit/ui Button']
    components:
      - { name: "add button", kit_component: Button, use: "Add, New or Create with the Plus icon", props_hint: "href or @click, icon" }
      - { name: "action bar", kit_component: ActionBar, use: "Where page-level actions sit", props_hint: "actions descriptors" }
    make: standards:make page --flavor=index
    checks: ['ui plus']
    paths: []
    keywords: [add, new, create button, plus]
    status: ready
  - id: ui-page.external-link
    recipe: External link
    summary: target=_blank links carry rel=noopener and the external-link icon.
    kit: ['@kit/ui Button', '@kit/ui DropdownLink']
    components:
      - { name: "external link", kit_component: Button, use: "A link styled as a button, target _blank with rel noopener and the external icon", props_hint: "href, target, rel" }
      - { name: "menu link", kit_component: DropdownLink, use: "An external link inside a menu", props_hint: "href" }
    make: standards:make page --flavor=show
    checks: ['ui new-tab']
    paths: []
    keywords: [external, new tab, blank, outbound link]
    status: ready
  - id: ui-page.action-menu
    recipe: Record action menu
    summary: Action menus run actions only. Navigation goes in links or tabs, never in an action menu, and nothing hand-rolls a kit primitive.
    kit: ['@kit/ui RowActions', '@kit/ui DropdownAction', '@kit/ui DropdownConfirm']
    components:
      - { name: "row menu", kit_component: RowActions, use: "The action menu on a record", props_hint: "actions descriptors" }
      - { name: "action item", kit_component: DropdownAction, use: "Runs an action", props_hint: "action" }
      - { name: "confirm item", kit_component: DropdownConfirm, use: "An action that needs confirmation", props_hint: "action, confirm text" }
      - { name: "delete item", kit_component: DropdownDelete, use: "Deletes with confirmation", props_hint: "href" }
      - { name: "dialog", kit_component: Dialog, use: "A confirmation or detail dialog", props_hint: "open, title" }
    make: standards:make page --flavor=show
    checks: ['descriptors', 'js-imports']
    paths: []
    keywords: [menu, dropdown, actions, kebab, row actions]
    status: ready
  - id: ui-page.upload
    recipe: File upload field
    summary: File inputs only come from the kit dropzone component inside a form page.
    kit: ['@kit/ui FileInput', '@kit/ui BulkDrop']
    components:
      - { name: "file field", kit_component: FileInput, use: "The only file input", props_hint: "v-model, accept, multiple" }
      - { name: "drop zone", kit_component: BulkDrop, use: "Drag-and-drop or paste of many files", props_hint: "@files" }
    make: standards:make page --flavor=form
    checks: ['ui dropzone']
    paths: []
    keywords: [upload, file, dropzone, attachment, image]
    status: ready
  - id: ui-page.data-table
    recipe: Data table list
    summary: >-
      Sorting, search, filters, row actions with confirmation, selection and bulk actions through the kit DataTable (tey/kit 0.4.8+), not a hand-rolled table.
      The server declares everything with TableQuery: columns and their sorts, labelled filters with their options (`choices`; any other value is a 400) and
      bulk Actions (`bulk`), which make rows selectable. BulkBar floats over the page while rows are selected (registered with useStickyBars) and posts `ids[]`;
      the handler resolves them with TableSelection inside its own scope, which refuses the whole request (422) if any id is not there. Reordering is not covered yet.
    kit: ['@kit/ui DataTable', '@kit/ui IndexToolbar', '@kit/ui BulkBar', '@kit/ui RowActions']
    components:
      - { name: "rows", kit_component: DataTable, use: "Sortable, selectable rows from TableData", props_hint: "table" }
      - { name: "filters", kit_component: IndexToolbar, use: "Search and the server's filter choices", props_hint: "table.choices" }
      - { name: "bulk bar", kit_component: BulkBar, use: "Bulk actions on the selection, floating with the count and Clear", props_hint: "table.bulkActions" }
      - { name: "row menu", kit_component: RowActions, use: "Per-row actions", props_hint: "actions descriptors" }
    make: standards:make crud --flavor=resource
    checks: ['21', 'descriptors', 'js-imports']
    paths: ['app/**/Http/Controllers/**SelectionController.php', 'resources/js/pages/**/Index/Page.vue']
    keywords: [sort, filter, toolbar, reorder, row action, confirm, data table, bulk, selection]
    status: ready
    evidence: { apps: 5, count: 6, prs: 6, past_apps: 6, past_count: 33 }
  - id: ui-page.crud-resource
    recipe: CRUD resource screens
    summary: >-
      `standards:make crud <Record>` emits a whole workspace-owned resource: model and migration (with lock_version), a policy gated by the record's capability
      then its permissions, a provider that registers both with the kit, CRUDDY controllers and routes, form requests, one Action per write (principal first,
      stale writes refused), typed ViewModels, Index, Form and Show pages, server toasts on save, and feature tests on the app's synthetic fixture.
      `--bulk` adds selection and a bulk delete, `--mcp` read and write capability tools, `--soft-deletes` soft deletes and a restoration.
    kit: ['@kit/ui DataTable', '@kit/ui FormCard', '@kit/ui SectionHeader', '@kit/ui Dialog']
    make: standards:make crud --flavor=resource
    checks: ['20', '21', 'actions', 'descriptors', 'toast', 'js-imports']
    paths: ['app/Models/**', 'app/Policies/**', 'app/Providers/**ServiceProvider.php', 'routes/**']
    keywords: [crud, resource, scaffold, index form show, record type, manage records]
    status: ready
    evidence: { apps: 7, count: 15, prs: 15, past_apps: 33, past_count: 312 }
  - id: ui-page.workbench
    recipe: Workbench page
    summary: >-
      A multi-pane editor for a sequence of items with a live preview (slides and their blocks, a valuation and its comparables) on tey/kit's Workbench (0.4.20+):
      a navigator, the stage (an optional sticky toolbar and a resizable footer) and an inspector that follows the stage's selection; three resizable columns from
      xl, the inspector in a drawer at lg and tabs below, the layout remembered per person. `standards:make workbench <Name>` emits the kit wiring (capability,
      permissions, routes, navigation), a policy, the page and order controllers, a principal-first Reorder Action guarded by a version (a stale one is 409 and
      the page rolls back), a stand-in item Query to replace with your model, a typed WorkbenchViewModel, Page.vue with one inspector, and a feature test.
    kit: ['@kit/ui Workbench', '@kit/ui WorkbenchNavigator', '@kit/ui WorkbenchInspector', '@kit/ui WorkbenchZoom']
    components:
      - { name: "workbench", kit_component: Workbench, use: "The navigator, stage, footer and inspector regions with the actions bar", props_hint: "workbench-key, items, layout, reorder, version, actions" }
      - { name: "navigator", kit_component: WorkbenchNavigator, use: "The items as a filterable, reorderable listbox (the default navigator)", props_hint: "workbench-key, label" }
      - { name: "inspector", kit_component: WorkbenchInspector, use: "The inspector registered for the selection's type (the default inspector)", props_hint: "workbench-key" }
      - { name: "zoom", kit_component: WorkbenchZoom, use: "Fit to width, fit to page and zoom steps for the stage", props_hint: "workbench-key" }
    make: standards:make workbench --flavor=page
    checks: ['20', '21', 'actions', 'descriptors', 'js-imports']
    paths: ['resources/js/pages/**/Workbench/Page.vue', 'app/**/Queries/**WorkbenchItems.php']
    keywords: [workflow, workbench, editor, slide editor, sequence, live preview, inspector, multi-pane, bespoke page]
    status: ready
    evidence: { apps: 5, count: 25, prs: 25, past_apps: 10, past_count: 40 }
