answer: Who can see or do something
entry: access-tenancy
nodes:
  - id: access-tenancy
    question: Is the actor an unauthenticated recipient arriving by a signed token link?
    options:
      - { answer: "Yes", next: access-tenancy.signed-link }
      - { answer: "No, a signed-in user", next: access-tenancy.user }
      - { answer: "None of these", next: access-tenancy.byo }
  - id: access-tenancy.user
    question: What decides access?
    why: Capabilities, entitlements, membership and admission stay distinct.
    options:
      - { answer: "A role permission or a record policy", next: access-tenancy.authorization }
      - { answer: "A purchase or plan (entitlement)", next: access-tenancy.entitlements }
      - { answer: "Workspace membership", next: access-tenancy.membership }
      - { answer: "Login or request hardening, or a paired second device", next: access-tenancy.hardening }
      - { answer: "None of these", next: access-tenancy.user.byo }
  - id: access-tenancy.authorization
    question: Is it a role permission, or authorization on a record?
    why: Permissions, capabilities, entitlements and membership stay distinct.
    options:
      - { answer: "A role permission", next: access-tenancy.permissions }
      - { answer: "A policy on a record", next: access-tenancy.capability }
      - { answer: "None of these", next: access-tenancy.authorization.byo }
  - id: access-tenancy.hardening
    question: Which hardening?
    options:
      - { answer: "Login throttling, local login or two-factor", next: access-tenancy.auth-hardening }
      - { answer: "Host split or security headers on every request", next: access-tenancy.host-middleware }
      - { answer: "A second device acts for a signed-in user (a phone remote, a paired screen)", next: access-tenancy.device-pairing }
      - { answer: "None of these", next: access-tenancy.hardening.byo }
  - id: access-tenancy.signed-link
    recipe: Signed recipient link
    summary: A hashed, expiring, revocable token link that records who used it.
    kit: []
    checks: []
    paths: []
    keywords: [signed link, token, magic link, recipient, revoke]
    status: gap
    evidence: { apps: 4, count: 7, prs: 7 }
  - id: access-tenancy.capability
    recipe: Capability or policy
    summary: A policy authorizes the record; the operation asks it, never a role check in code.
    kit: []
    make: standards:make policy --flavor=plain
    checks: ['32']
    paths: ['app/**/Policies/**']
    keywords: [permission, policy, capability, authorize]
    status: ready
    evidence: { apps: 2, count: 3, prs: 3, past_apps: 7, past_count: 32 }
  - id: access-tenancy.entitlements
    recipe: Entitlement
    summary: Access granted by purchase or plan, kept distinct from capabilities and roles.
    kit: []
    checks: []
