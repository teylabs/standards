  - id: access-tenancy.membership.scoped-guest
    recipe: Scoped guest
    summary: Invite someone to act on ONE record, with no other access. Build your own; there is no generator yet.
    kit: []
    checks: []
    paths: []
    keywords: [scoped guest, one record, guest access, invite to a record, single record, share one, external collaborator]
    status: draft
    rules:
      - "A role with zero grants plus a scope row: record, membership, email, invited_by, revoked_at."
      - "ONE access class, used by routes, MCP tools and policies alike."
      - "MCP tokens are limited to the record."
      - "Feature-gated."
      - "Scoped guests NEVER appear as transfer, admin or role-picker targets, or in member lists."
      - "Revoke is immediate: it kills pending links and drops the guest membership on the last scope."
      - "Acceptance is audited."
    related: [access-tenancy.membership.workspace, access-tenancy.capability]
    graduate: "To become a Concierge feature (invitation scope, teylabs/concierge issue 133)."
  - id: access-tenancy.device-pairing
    recipe: Device pairing
    summary: A second device acts for a signed-in user (a phone remote, a paired screen) through a short-lived pairing link and a scoped cookie, re-authorised on every request. Build your own; there is no generator yet.
    kit: []
    checks: []
    paths: []
    keywords: [pair a device, device pairing, pairing link, phone remote, paired screen, second device, remote control]
    status: draft
    rules:
      - "Every remote request re-checks that the user may still perform the action."
      - "The pairing link is a temporarySignedRoute (at most 2 minutes), minted only on an explicit user action, never rendered into the page ahead of time, and bound to a per-resource secret version."
      - "Pairing sets an encrypted HttpOnly, Secure, SameSite=Lax (or Strict) cookie scoped to the remote path, carrying the resource, user, expiry (at most 12 hours) and secret version."
      - "Revocation: rotating the secret ends every pairing and unused link, and the user can see the active pairings (pairedAt only)."
      - "Throttles on pair, pairing and commands."
      - "Command endpoints are CSRF-protected (or token-bound), and the feed is private, no-store."
      - "No recording: commands are ephemeral (read since a cursor), and no device identity beyond pairedAt is stored."
      - "Tests: an expired link, a reused link after rotation, a revoked cookie, lost permission, and the throttle."
    related: [ui-page.remote, ui-page.signed-guest, access-tenancy.signed-link]
    graduate: "Graduate to standards:make pairing when a second app needs it."
