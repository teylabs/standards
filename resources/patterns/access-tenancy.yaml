    evidence: { apps: 3, count: 6, prs: 6 }
  - id: access-tenancy.membership
    question: Who is being let in?
    why: A workspace member sees the workspace; a scoped guest acts on one record and appears nowhere else.
    options:
      - { answer: "A workspace member (invites, roles, transfer)", next: access-tenancy.membership.workspace }
      - { answer: "Someone invited to act on one record, with no other access", next: access-tenancy.membership.scoped-guest }
      - { answer: "None of these", next: access-tenancy.membership.byo }
