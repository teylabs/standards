answer: A tool an AI assistant calls over MCP
entry: mcp
nodes:
  - id: mcp
    question: What are you adding to MCP?
    options:
      - { answer: "A tool over an app operation", next: mcp.tool }
      - { answer: "A capability manifest, llms.txt or a parity guard", next: mcp.agent-docs }
      - { answer: "Deciding where MCP files live in a module", next: mcp.module-placement }
      - { answer: "None of these", next: mcp.byo }
  - id: mcp.tool
    question: Does the tool change data?
    why: Writing tools declare WRITES and confirmation; read tools stay side-effect free.
    options:
      - { answer: "It only reads", next: mcp.read }
      - { answer: "It creates, changes or deletes data", next: mcp.write }
      - { answer: "It starts slow or external work", next: mcp.queued }
      - { answer: "None of these", next: mcp.tool.byo }
  - id: mcp.read
    recipe: Read capability tool
    summary: A kit CapabilityTool with a #[Capability] attribute, an ABILITY and a call() that reuses the page's shared operation.
    kit: ['Tey\Kit\Features\Mcp\CapabilityTool', 'Tey\Kit\Features\Mcp\Capability']
    make: standards:make capability-tool --flavor=read
    checks: ['55']
    paths: ['app/Mcp/Tools/**']
    keywords: [mcp, tool, assistant, read, query, agent]
    status: ready
    evidence: { apps: 9, count: 27, prs: 27, past_apps: 0, past_count: 0 }
  - id: mcp.write
    recipe: mcp-parity
    summary: A CapabilityTool with WRITES = true that calls the same Action as the UI, declared in the MCP capability manifest with its parity test.
    kit: ['Tey\Kit\Features\Mcp\CapabilityTool', 'Tey\Kit\Features\Mcp\Capability']
    make: standards:make capability-tool --flavor=write
    recipe_make: "mod:butter/mcp-parity {Name}"
    checks: ['55', 'actions']
    paths: ['app/Mcp/Tools/**']
    keywords: [mcp, tool, write, update, delete, mutate, parity]
    status: ready
    evidence: { apps: 1, count: 4, prs: 4, past_apps: 1, past_count: 23 }
  - id: mcp.queued
    recipe: Queued capability tool
    summary: Slow or external work answers with a run token the assistant reads back.
    kit: ['Tey\Kit\Features\Mcp\CapabilityTool']
    checks: ['55']
    paths: []
    keywords: [mcp, queued, long running, external, run token]
    status: gap
  - id: mcp.agent-docs
    recipe: Agent docs and parity guard
    summary: A capability manifest, generated llms.txt and an architecture test that keeps routes and MCP tools in parity.
    kit: []
    checks: ['55']
    paths: ['docs/mcp-capabilities.json']
    keywords: [llms.txt, manifest, capabilities, parity, agent docs]
    status: gap
    evidence: { apps: 7, count: 10, prs: 10 }
  - id: mcp.module-placement
    recipe: MCP files in a module
    summary: Where MCP tools, resources and servers live inside a module.
    kit: []
    checks: []
    paths: []
    keywords: [module, placement, mcp folder]
    status: gap
    evidence: { apps: 1, count: 1, prs: 1 }
  - id: mcp.byo
    recipe: Build your own
    summary: "No recipe fits this answer yet. Proceed with the general conventions, stamp new files `standards-pattern: gap`, and the demand is recorded."
    kit: []
    checks: []
    paths: []
    keywords: []
    status: byo
