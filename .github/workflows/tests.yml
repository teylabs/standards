name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
        pest: [4, 5]
        # Linux proves both majors; Windows runs Pest 5 only to keep CI lean.
        exclude:
          - os: windows-latest
            pest: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ runner.os == 'Windows' && 'mbstring, pdo, pdo_sqlite, sqlite3, exif, fileinfo' || 'mbstring, sqlite3, pcntl, exif, fileinfo' }}
          tools: composer:v2
          coverage: none
      - name: Validate package
        run: composer validate --strict
      - name: Install dependencies
        run: composer require --dev "pestphp/pest:^${{ matrix.pest == 4 && '4.7' || '5.0' }}" "pestphp/pest-plugin-arch:^${{ matrix.pest }}.0" -W --no-interaction --prefer-dist
      - name: Check CI standards
        env:
          PREFLIGHT_CI_ENFORCE: 'true'
        run: php bin/standards ci --strict
      - name: Test
        run: composer test
      - name: Production install smoke test
        # The CLI works without PCNTL; Windows also verifies the deployment refusal.
        shell: bash
        run: |
          production=$(mktemp -d)
          trap 'rm -rf "$production"' EXIT
          mkdir "$production/package"
          # McpRun* folders are per-test temporary copies; never package them.
          tar --exclude=vendor --exclude=.git --exclude=composer.lock --exclude='fixtures/McpRun*' -cf - . | tar -xf - -C "$production/package"
          cat > "$production/composer.json" <<JSON
          {
              "repositories": [{ "type": "path", "url": "./package", "options": { "symlink": false } }],
              "require": { "tey/standards": "*@dev" }
          }
          JSON
          composer install --working-dir="$production" --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php "$production/package/tests/no-dev-smoke.php" "$production/vendor/autoload.php" ${{ runner.os == 'Windows' && '--expect-no-pcntl' || '' }}

  pest-5-coexistence:
    name: architecture checks under Pest 5 in an app
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pcntl
          tools: composer:v2
          coverage: none
      - name: Install with Pest 5 in an app
        run: |
          app=$(mktemp -d)
          trap 'rm -rf "$app"' EXIT
          cat > "$app/composer.json" <<JSON
          {
              "type": "project",
              "repositories": [{ "type": "path", "url": "$GITHUB_WORKSPACE", "options": { "symlink": false } }],
              "require": { "tey/standards": "*@dev" },
              "require-dev": { "pestphp/pest": "^5.0", "pestphp/pest-plugin-arch": "^5.0", "nikic/php-parser": "^5.0", "spatie/laravel-multitenancy": "^4.0", "illuminate/database": "^12.0 || ^13.0", "illuminate/queue": "^12.0 || ^13.0" },
              "autoload-dev": { "psr-4": { "FixtureGood\\\\": "fixtures/Good/src/", "FixtureBad\\\\": "fixtures/Bad/src/" } },
              "scripts": { "test": "pest" },
              "minimum-stability": "dev",
              "prefer-stable": true,
              "config": { "allow-plugins": { "pestphp/pest-plugin": true } }
          }
          JSON
          cp -R fixtures "$app/fixtures"
          mkdir "$app/tests"
          cp phpunit.xml "$app/phpunit.xml"
          cat > "$app/tests/ConformanceTest.php" <<'PHP'
          <?php

          use PHPUnit\Framework\AssertionFailedError;
          use Tey\Standards\Configuration;
          use Tey\Standards\Conformance;

          arch('[rule 20] placement passes clean code and rejects seeded violations under Pest 5', function () {
              foreach (['Good', 'Bad'] as $kind) {
                  $namespace = 'Fixture'.$kind;
                  $checks = new Conformance(new Configuration(
                      base: __DIR__.'/../fixtures/'.$kind,
                      classRoots: ['src' => $namespace],
                      sourceRoots: ['src', 'routes'],
                      uiRoots: ['src/UI'],
                      uiNamespaces: [$namespace.'\UI'],
                      hostNamespaces: [$namespace],
                      controllerRoots: ['src/Domain/*/Http/Controllers'],
                      routeRoots: ['routes'],
                      controllerSuffix: 'Controller',
                      routeDirectory: 'routes',
                      viewModelRoots: ['src/Domain/*/ViewModels', 'src/UI'],
                      viewModelBases: ['FixtureGood\UI\TypedViewModel'],
                      typedViewModel: 'FixtureGood\UI\TypedViewModel',
                      viewModelSuffix: 'ViewModel',
                      pageRoots: ['pages'],
                      pageScaffolds: ['pages'],
                      placements: ['Policy' => ['src/Domain/*/Policies'], 'Capability' => ['src/Domain/*/Enums']],
                      retired: [$namespace.'\Retired' => ['src/Retired']],
                      discoveryRoots: ['src/Domain', 'src/UI'],
                      developmentNamespaces: ['Pest'],
                      safeAttributes: [],
                      mediaTrait: 'FixtureGood\UI\MediaBehaviour',
                      mediaInterface: 'FixtureGood\UI\MediaContract',
                  ));
                  if ($kind === 'Good') {
                      $checks->assert('20');
                  } else {
                      expect($checks->violations('20'))->toContain(
                          ['target' => 'FixtureBad\Domain\Billing\ViewModels\UntypedName', 'check' => 'ViewModel needs configured suffix'],
                          ['target' => 'FixtureBad\Domain\Billing\ViewModels\InvoiceViewModel', 'check' => 'ViewModel must extend typed base'],
                      );
                      expect(fn () => $checks->assert('20'))->toThrow(AssertionFailedError::class, 'violation:');
                  }
              }
          });
          PHP
          composer install --working-dir="$app" --no-interaction --prefer-dist
          composer show --working-dir="$app" pestphp/pest | grep -E '^versions'
          php tests/no-dev-smoke.php "$app/vendor/autoload.php" --with-dev
          composer test --working-dir="$app"
