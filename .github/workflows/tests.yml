name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl
          tools: composer:v2
          coverage: none
      - name: Validate package
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Test
        run: composer test
      - name: Production install smoke test
        run: |
          production=$(mktemp -d)
          trap 'rm -rf "$production"' EXIT
          tar --exclude=vendor --exclude=.git --exclude=composer.lock -cf - . | tar -xf - -C "$production"
          composer install --working-dir="$production" --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php "$production/tests/no-dev-smoke.php"
